steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg
      - RENDERER_IMAGE=${_RENDERER_IMAGE}
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/slidegen-template-worker:${_TAG}
      - -f
      - template-worker/Dockerfile
      - .
images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/slidegen-template-worker:${_TAG}
substitutions:
  _REGION: us-central1
  _REPO: pixelpitch-agents
  _TAG: latest
options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
