[project]
name = "pixelpitch-agy-authoring-worker"
version = "0.1.0"
description = "Isolated Google Antigravity SDK worker for Pixelpitch slide authoring"
requires-python = ">=3.11,<3.14"
dependencies = [
    "google-antigravity>=0.1.15,<0.2.0",
    "watchfiles",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = []
