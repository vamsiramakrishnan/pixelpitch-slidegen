[project]
name = "slidify"
version = "0.1.0"
description = "Render-and-classify pipeline that converts HTML decks to maximally-editable PPTX."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Pixelpitch" }]
dependencies = [
    "playwright>=1.47",
    "python-pptx>=1.0",
    "pydantic>=2.7",
    "pillow>=10.0",
    "scikit-image>=0.24",
    "numpy>=1.26",
    "pytesseract>=0.3.10",
    "anthropic>=0.40",
    "structlog>=24.1",
    "diskcache>=5.6",
    "lxml>=5.0",
    "click>=8.1",
    "httpx>=0.27",
    "google-genai>=0.3",
    "google-cloud-aiplatform>=1.60",
    "pyyaml>=6.0.3",
    "fonttools>=4.50",
]

[project.scripts]
slidify = "slidify.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "hypothesis>=6.100",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["slidify"]

[tool.hatch.build.targets.wheel.force-include]
"slidify/patterns/data/tailwind.json" = "slidify/patterns/data/tailwind.json"
"slidify/patterns/data/patterns.yaml" = "slidify/patterns/data/patterns.yaml"
"slidify/guides/authoring.md" = "slidify/guides/authoring.md"
"slidify/guides/agent-quickstart.md" = "slidify/guides/agent-quickstart.md"
"slidify/guides/troubleshooting.md" = "slidify/guides/troubleshooting.md"
"slidify/guides/binary.md" = "slidify/guides/binary.md"
"slidify/guides/api.md" = "slidify/guides/api.md"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
ignore = [
    "E501",   # line length handled by formatter
    "RUF001", # ambiguous unicode in strings (× / → are intentional in CLI output)
    "RUF002", # ambiguous unicode in docstrings
    "RUF003", # ambiguous unicode in comments
    "RUF046", # int(int(...)) cast — we keep explicit casts for clarity
    "UP042",  # StrEnum migration unrelated to this work
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "tests/patterns"]
markers = [
    "slow: tests that launch a full Chromium per-test (run with `-m slow` to include)",
]
addopts = "-m 'not slow'"
