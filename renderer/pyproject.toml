[project]
name = "pixelpitch-slidegen-renderer"
version = "0.1.0"
description = "HTTP wrapper around slidify: HTML slides in, branded PPTX into GCS out."
license = "Apache-2.0"
requires-python = ">=3.11,<3.14"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "google-cloud-storage>=2.14",
    "httpx>=0.27",
    "slidify",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2,<10.0.0",
]

[tool.uv.sources]
# Slidify is versioned alongside this service.
slidify = { path = "../vendor/slidify" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["renderer"]
